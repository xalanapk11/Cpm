<!DOCTYPE html>
<html lang="en" data-th="gold"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPM Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g1:#ffe28a;--g2:#ff9a3d;--gl:255,150,60;--bg:#0e0f12;--card:#17191e;--card2:#1f2229;--line:#2a2e37;--tx:#f2f4f7;--mu:#8b92a1;--bad:#ff5d6c;--ok:#3ddc84;
--st:max(12px,env(safe-area-inset-top));--sb:max(16px,env(safe-area-inset-bottom))}
html[data-th=blue]{--g1:#a8c8ff;--g2:#5b8cff;--gl:90,130,255}
html[data-th=green]{--g1:#b8ffd8;--g2:#2fe0a8;--gl:47,224,168}
html[data-th=red]{--g1:#ffc0cf;--g2:#ff4d6d;--gl:255,77,109}
html[data-th=silver]{--g1:#ffffff;--g2:#aab4c8;--gl:200,210,235}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:var(--st) 16px calc(var(--sb) + 8px);min-height:100vh;background:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 10px}
.hi small{display:block;color:var(--mu);font-size:13px}
.hi b{font-size:26px;letter-spacing:-.6px;color:var(--g1)}
.th{display:flex;gap:9px}
.th button{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.2);transition:transform .2s}
.th button.on{box-shadow:0 0 0 2px #fff;transform:scale(1.15)}
.banner{margin:6px 0 12px;padding:10px 12px;border-radius:12px;border:1px solid var(--bad);background:rgba(255,93,108,.1);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mu);font-size:14px;font-weight:600}
.tab.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a1000;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;text-align:left;min-height:132px;padding:14px;border-radius:18px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
background:radial-gradient(150px 110px at 0 0,rgba(var(--gl),.16),transparent 70%),linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s;animation:up .35s ease both;animation-delay:calc(var(--i)*30ms)}
.item:active{transform:scale(.96)}
.item.vip{border-color:rgba(var(--gl),.7);box-shadow:0 0 18px rgba(var(--gl),.25),inset 0 1px 0 rgba(255,255,255,.28)}
.item b{font-size:15px;letter-spacing:-.2px;background:linear-gradient(90deg,#fff,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.item>span:last-child{color:var(--mu);font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:11px;right:12px;font-size:10px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#2a1a00}
.ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;margin-bottom:4px;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 3px 8px rgba(var(--gl),.3),inset 0 1.5px 0 rgba(255,255,255,.6)}
.ic svg{width:28px;height:28px;fill:none;stroke:#1a0f00;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:rgba(255,255,255,.5)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:rgba(20,22,27,.98);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sb) + 6px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.25,1);max-height:90vh;overflow:auto;border-top:1px solid rgba(255,255,255,.18)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center;color:var(--mu)}
.x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:6px;padding-right:44px}
.sh .ic{margin:0}
.sh h2{font-size:19px;letter-spacing:-.3px}
.desc{color:var(--mu);font-size:13.5px;margin-bottom:6px}
label.l{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:13px;color:var(--tx);font:inherit;font-size:15px;outline:0}
select option{background:#1f2229}
input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(var(--gl),.18)}
input.err,select.err,textarea.err{border-color:var(--bad)}
input[type=file]{border-style:dashed;padding:11px;font-size:13.5px}
textarea{font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical;min-height:130px}
.pw{position:relative}.pw input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;color:var(--mu);display:grid;place-items:center}
.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14.5px}
.chk input{width:20px;height:20px;accent-color:var(--g2);flex:none}
.seg{display:flex;gap:8px;margin:6px 0 4px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);color:var(--mu);font-weight:600}
.seg button.on{background:rgba(var(--gl),.18);border-color:var(--g2);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pick{flex:1;margin:0;padding:11px;border-radius:10px;border:1px dashed #555;text-align:center;color:#ddd;font-size:13.5px;cursor:pointer}
.cnt{font-size:12px;color:var(--mu);white-space:nowrap}
.go{width:100%;margin-top:18px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a1000;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.65}
.note{margin-top:10px;font-size:12px;color:var(--mu);text-align:center}
.res{margin-top:14px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--bad)}
.res.ok{border-color:#2f7d4f}
.res pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto;user-select:text;-webkit-user-select:text}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button{padding:9px 12px;border-radius:10px;border:1px solid #444;background:var(--card2);font-size:13.5px}
.rows{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto;margin-top:6px}
.rw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:14px}
.rw.on{border-color:var(--g2);background:rgba(var(--gl),.14)}
.rw.dis{opacity:.45}
.rw input{width:18px;height:18px;flex:none;accent-color:var(--g2)}
.rw small{margin-left:auto;color:var(--mu);font-size:11.5px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(var(--st) + 8px);transform:translate(-50%,-140%);background:var(--card2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;transition:transform .3s;max-width:90%}
.toast.on{transform:translate(-50%,0)}.toast.bad{border-color:var(--bad)}

/* ══ EFFECTS ══ (static ones always on; heavy ones only inside html.fx, which the FPS guard / ✨ button controls) */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
#bgx{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;
background:radial-gradient(70% 38% at 50% -6%,rgba(var(--gl),.24),transparent 70%),radial-gradient(45% 28% at 100% 32%,rgba(124,92,255,.14),transparent 70%),radial-gradient(45% 28% at 0 62%,rgba(34,211,238,.11),transparent 70%),radial-gradient(60% 34% at 50% 108%,rgba(var(--gl),.18),transparent 70%),radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.3px) 0 0/22px 22px}
#bgx::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
.au{position:absolute;width:75vw;height:75vw;max-width:520px;max-height:520px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gl),.34),transparent 65%);will-change:transform;display:none}
.a1{top:-22vw;left:-24vw}.a2{bottom:-28vw;right:-26vw;opacity:.8}
html.fx .au{display:block;animation:au1 18s ease-in-out infinite alternate}
html.fx .a2{animation-name:au2;animation-duration:22s}
@keyframes au1{to{transform:translate3d(30vw,16vw,0) scale(1.25)}}
@keyframes au2{to{transform:translate3d(-28vw,-18vw,0) scale(1.2)}}
#pt{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;display:none}
html.fx #pt{display:block}
#pt i{position:absolute;bottom:-10px;border-radius:50%;background:rgba(var(--gl),.85);opacity:0;will-change:transform,opacity;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.85}100%{transform:translate3d(var(--dx),-105vh,0);opacity:0}}
body.so #pt i,body.so .au{animation-play-state:paused}

/* cards */
.item::after{content:"";position:absolute;inset:0;background:radial-gradient(130px circle at var(--mx,50%) var(--my,50%),rgba(var(--gl),.22),transparent 70%);opacity:0;transition:opacity .2s;pointer-events:none}
.item:active::after{opacity:1}
.item.done:not(.vip){animation:none;opacity:1}
.rip{position:absolute;border-radius:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:rgba(var(--gl),.5);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(28);opacity:0}}
.spk{position:absolute;font-size:12px;opacity:0;display:none;pointer-events:none;color:var(--g1)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes sweep2{0%{transform:translateX(-90px) skewX(-20deg)}45%,100%{transform:translateX(340px) skewX(-20deg)}}
@keyframes float{50%{transform:translateY(-4px) rotate(-4deg)}}
html.fx .item:not(.vip)::before{content:"";position:absolute;top:0;bottom:0;left:0;width:46px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-90px) skewX(-20deg);animation:sweep2 5s ease-in-out infinite;animation-delay:calc(var(--i)*.45s);will-change:transform;pointer-events:none}
html.fx .item .ic{animation:float 3s ease-in-out infinite;animation-delay:calc(var(--i)*.25s)}
html.fx .item:not(.vip) .spk{display:block;animation:tw 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}

/* VIP card: spinning rainbow border, glow, shimmer, sparkles */
@keyframes spin{to{--ang:360deg}}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(var(--gl),.18)}50%{box-shadow:0 0 34px rgba(var(--gl),.4),0 0 60px rgba(var(--gl),.14)}}
.item.vip{border:1.5px solid transparent;
background:linear-gradient(#17140b,#100e08) padding-box,conic-gradient(from var(--ang),var(--g1),var(--g2),#ff4fd8,#7a5cff,#35e0ff,var(--g1)) border-box;
animation:up .35s ease both,spin 5s linear infinite,glow 2.8s ease-in-out infinite;animation-delay:0s}
.item.vip::before{content:"";position:absolute;top:0;bottom:0;left:0;width:46px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-90px) skewX(-20deg);animation:sweep2 4s ease-in-out infinite;will-change:transform;pointer-events:none}
.item.vip .spk{display:block;animation:tw 2.4s ease-in-out infinite}
.item.vip .ic{animation:float 2.6s ease-in-out infinite}
.item.vip b{background:linear-gradient(90deg,var(--g1),var(--g2),#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent}

/* sheet */
.sheet::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--g2),var(--g1),transparent)}
.sheet.vipS{box-shadow:0 -10px 50px rgba(var(--gl),.25)}
.sheet.vipS .go{background:linear-gradient(90deg,var(--g1),var(--g2),#ff4fd8,var(--g1));background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.sheet.vipS .sh h2{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet.on #sForm>*{animation:up .4s cubic-bezier(.2,.9,.25,1) both}
.sheet.on #sForm>*:nth-child(1){animation-delay:.08s}.sheet.on #sForm>*:nth-child(2){animation-delay:.12s}.sheet.on #sForm>*:nth-child(3){animation-delay:.16s}
.sheet.on #sForm>*:nth-child(4){animation-delay:.2s}.sheet.on #sForm>*:nth-child(5){animation-delay:.24s}.sheet.on #sForm>*:nth-child(n+6){animation-delay:.28s}
.go{position:relative;overflow:hidden}
.go.sent{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.05);box-shadow:0 0 40px rgba(var(--gl),.7)}}

/* theme wave, typed greeting, fx button */
.wave{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(var(--gl),.4);pointer-events:none;z-index:30;animation:wv .85s ease-out forwards}
@keyframes wv{to{transform:scale(80);opacity:0}}
.cur{border-right:2px solid var(--g2);animation:blink .6s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
.th{align-items:center}
.th .fxb{width:auto;height:24px;padding:0 9px;border-radius:99px;background:var(--card2);box-shadow:0 0 0 1.5px rgba(255,255,255,.2);font-size:12px;opacity:.5}
.th .fxb.on{opacity:1;transform:none;box-shadow:0 0 0 1.5px var(--g2)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<div id="pt"></div>
<div id="bgx"><i class="au a1"></i><i class="au a2"></i></div>

<div class="top">
  <div class="hi"><small>Welcome</small><b id="name">Hi there</b></div>
  <div class="th" id="th"></div>
</div>
<div class="banner" id="banner" hidden></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <button class="x" id="cl" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="sh"><span class="ic" id="sIc"></span><h2 id="sTitle"></h2></div>
  <p class="desc" id="sDesc"></p>
  <div id="sForm"></div>
  <button class="go" id="go"></button>
  <p class="note" id="sNote"></p>
  <div id="sRes"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0e0f12'); tg.setBackgroundColor('#0e0f12'); } catch (e) {} }
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const q = new URLSearchParams(location.search).get('api');
if (q) store.set('api', q);
const BASE = (API || q || store.get('api') || '').replace(/\/$/, '');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s ?? '').replace(/[*`]/g, '');

const IC = {
 money:'<circle class="f" cx="12" cy="12" r="9.5"/><path d="M14.8 9.2c-.5-.9-1.4-1.3-2.8-1.3-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2.1 2.6.9 2.6 2.1-1.1 2-2.6 2c-1.4 0-2.3-.4-2.8-1.3M12 5.8v2m0 8.3v2.1"/>',
 coins:'<ellipse class="f" cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>',
 gem:'<path class="f" d="M6.2 3h11.6L22 9.2 12 21.5 2 9.2z"/><path d="M2 9.2h20M9.2 3L7.4 9.2 12 21.5l4.6-12.3L14.8 3"/>',
 swap:'<rect class="f" x="2.5" y="3.5" width="9" height="8" rx="2.2"/><rect class="f" x="12.5" y="12.5" width="9" height="8" rx="2.2"/><path d="M14 7.5h6.5l-2.3-2.3M10 16.5H3.5l2.3 2.3"/>',
 car:'<path class="f" d="M4.5 15.5l1.7-5.6A2.2 2.2 0 0 1 8.3 8.3h7.4a2.2 2.2 0 0 1 2.1 1.6l1.7 5.6z"/><rect class="f" x="2.5" y="15.5" width="19" height="4.5" rx="1.8"/><path d="M6.5 17.8h.01M17.5 17.8h.01M9 12h6"/>',
 crown:'<path class="f" d="M3 8.5l4.6 4.2L12 5l4.4 7.7L21 8.5 19 19.5H5z"/><path d="M6 22h12"/>',
 gauge:'<circle class="f" cx="12" cy="12" r="9.5"/><path d="M12 12.5l3.8-4M12 4.5V6M5.5 8l1.1 1M18.5 8l-1.1 1M3.5 12H5m14 0h1.5"/><circle cx="12" cy="12.5" r="1.3"/>',
 pencil:'<path class="f" d="M3.5 20.5l1-4.3L16.3 4.4a2.1 2.1 0 0 1 3 3L7.7 19.4z"/><path d="M13.8 7l3.2 3.2M3.5 20.5l4.2-1"/>',
 refresh:'<circle class="f" cx="12" cy="12" r="3.2"/><path d="M20 11A8 8 0 0 0 6 6.8M4 4v4h4M4 13a8 8 0 0 0 14 4.2M20 20v-4h-4"/>',
 key:'<circle class="f" cx="8" cy="15.5" r="4.5"/><path d="M11.4 12.2L20.5 3M16.5 7l3 3M14 9.5l2.2 2.2"/>',
 unlock:'<rect class="f" x="4.5" y="11" width="15" height="10.5" rx="2.4"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7M12 15.5v2.5"/>',
 sparkles:'<path class="f" d="M10.5 3l2 5.8 5.8 2-5.8 2-2 5.8-2-5.8-5.8-2 5.8-2z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
 userplus:'<circle class="f" cx="10" cy="8" r="4.2"/><path d="M2.8 21a7.2 7.2 0 0 1 14.4 0M19.5 7.5v6M16.5 10.5h6"/>',
 plus:'<circle class="f" cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/>'
};
const I = k => `<svg viewBox="0 0 24 24">${IC[k]}</svg>`;

/* ── field helpers ── */
const EM = {k:'email', l:'Email', t:'email'}, PW = {k:'password', l:'Password', t:'password'};
const SRC = [{k:'src_email',l:'Source email',t:'email'},{k:'src_password',l:'Source password',t:'password'},{k:'dst_email',l:'Destination email',t:'email'},{k:'dst_password',l:'Destination password',t:'password'}];
const CH = [EM, PW, {k:'new_email',l:'New email',t:'email'}, {k:'new_password',l:'New password',t:'password'}];
const TYPE = d => ({k:'type', l:'Game', t:'select', o:[['cpm1','CPM1'],['cpm2','CPM2']], v:d});
const FILE = (k, l, a) => ({k, l, t:'file', a:a || ''});
const CHK = (k, l) => ({k, l, t:'check', v:true});

const FEATS = [

function parseBulk(text, parts) {
  const rows = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const t = line.split(':');
    if (parts === 2) { if (t.length >= 2 && t[0].trim()) rows.push({email: t[0].trim(), password: t.slice(1).join(':')}); }
    else {
      let i = -1; for (let j = 2; j < t.length; j++) if (t[j].includes('@')) { i = j; break; }
      if (t.length >= 4 && i > 0 && i < t.length - 1) rows.push({email: t[0].trim(), password: t.slice(1, i).join(':'), new_email: t[i].trim(), new_password: t.slice(i + 1).join(':')});
    }
  }
  return rows;
}

/* ── network ── */
async function call(ep, body, files) {
  body = {...body, initData: tg?.initData || ''};
  let opt;
  if (files && Object.keys(files).length) {
    const fd = new FormData();
    for (const [k, v] of Object.entries(body)) fd.append(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
    for (const [k, f] of Object.entries(files)) fd.append(k, f, f.name);
    opt = {method: 'POST', body: fd};
  } else opt = {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
  let r;
  try { r = await fetch(BASE + '/api/' + ep, opt); }
  catch (e) { return {ok: false, error: 'Could not reach the bot server. Make sure it is online.'}; }
  const ct = r.headers.get('Content-Type') || '';
  if (ct.includes('application/json')) {
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok || d.error) return {ok: false, error: d.error || ('Server error ' + r.status)};
    return {ok: true, data: d};
  }
  if (!r.ok) return {ok: false, error: r.status === 413 ? 'File too large (max 8 MB).' : 'Server error ' + r.status};
  const blob = await r.blob();
  const m = /filename="?([^";]+)"?/.exec(r.headers.get('Content-Disposition') || '');
  return {ok: true, blob, name: m ? m[1] : ''};
}
async function pool(items, n, fn) {
  let i = 0; const out = new Array(items.length);
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));
  return out;
}

/* ── results ── */
function saveBlob(name, blob) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function shareBlob(name, blob) {
  const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});
  try { await navigator.share({files: [file], title: name}); } catch (e) {}
}
function showResult({ok, text, files = [], copy}) {
  const box = document.createElement('div');
  box.className = 'res' + (ok ? ' ok' : '');
  const pre = document.createElement('pre'); pre.textContent = text || ''; box.appendChild(pre);
  const acts = document.createElement('div'); acts.className = 'acts';
  const mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; acts.appendChild(b); };
  if (text) mk('Copy', () => navigator.clipboard?.writeText(copy || text).then(() => toast('Copied')).catch(() => toast('Copy failed', true)));
  files.forEach(f => {
    mk('⬇ Save ' + f.name, () => saveBlob(f.name, f.blob));
    const probe = new File([f.blob], f.name);
    if (navigator.canShare?.({files: [probe]})) mk('Share', () => shareBlob(f.name, f.blob));
  });
  if (acts.children.length) box.appendChild(acts);
  $('sRes').innerHTML = ''; $('sRes').appendChild(box);
  box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  haptic(ok);
}
function dataText(d) {

  if (Array.isArray(d.accounts) && d.accounts.length) t += '\n\n' + d.accounts.map(a => `${a.email}:${a.password}`).join('\n');
  return t;
}

let timer = null;
function busy(on, label) {

  if (on) { const s = Date.now(); b.disabled = true; const tick = () => b.textContent = (label || 'Working…') + ' ' + Math.floor((Date.now() - s) / 1000) + 's'; tick(); timer = setInterval(tick, 1000); }
  else b.disabled = false;
}
function restoreLabel() { $('go').textContent = cur.custom ? $('go').textContent : (bulkOn ? 'Run all' : 'Run'); }

$('go').onclick = async () => {
  if (cur.custom === 'vip') return vipGo();
  const label = $('go').textContent;
  if (cur.bulk && bulkOn) return runBulk(label);
  const v = {}, files = {}; let bad = false;
  for (const f of cur.f) {
    const el = $('sForm').querySelector(`[data-k="${f.k}"]`); if (!el) continue;
    el.classList.remove('err');
    if (f.t === 'file') { const fl = el.files[0]; if (!fl) { el.classList.add('err'); bad = true; } else if (fl.size > 7.5 * 1048576) { toast('File too large (max 8 MB)', true); return; } else files[f.k] = fl; }
    else if (f.t === 'check') v[f.k] = el.checked;
    else { const val = f.t === 'password' ? el.value : el.value.trim(); if (!val) { el.classList.add('err'); bad = true; } v[f.k] = f.t === 'number' ? Number(val) : val; }
  }
  if (bad) { haptic(false); return toast('Fill all fields', true); }
  let body;
  if (cur.build) body = cur.build(v);
  else { body = {}; for (const f of cur.f) if (f.t !== 'file') body[f.k] = v[f.k]; }
  body = {...body, ...(cur.x || {})};
  $('sRes').innerHTML = '';
  busy(true);
  const r = await call(cur.ep, body, files);
  busy(false); $('go').textContent = label;
  if (!r.ok) return showResult({ok: false, text: r.error});
  if (r.blob) return showResult({ok: true, text: `Done. File ready (${Math.max(1, Math.round(r.blob.size / 1024))} KB).`, files: [{name: r.name || cur.out || 'result.bin', blob: r.blob}]});
  showResult({ok: true, text: dataText(r.data), copy: r.data.password});
};

async function runBulk(label) {
  const rows = parseBulk($('bulk').value, cur.bulk);
  if (!rows.length) { haptic(false); return toast('No valid lines found', true); }
  if (rows.length > 200) return toast('Max 200 lines at a time', true);
  $('sRes').innerHTML = '';
  let done = 0; const b = $('go'); b.disabled = true; b.textContent = `Working… 0/${rows.length}`;
  const res = await pool(rows, 3, async row => {
    const r = await call(cur.ep, {...row, ...(cur.x || {})});
    b.textContent = `Working… ${++done}/${rows.length}`;
    if (!r.ok) return {ok: false, line: `❌ ${row.email} → ${r.error}`};
    return {ok: true, line: `✅ ${row.email} → ${clean(r.data.message || 'Done').replace(/\s*\n\s*/g, ' | ')}`};
  });
  b.disabled = false; b.textContent = label;
  const okc = res.filter(x => x.ok).length;
  showResult({ok: okc > 0, text: `${okc}/${res.length} succeeded\n\n` + res.map(x => x.line).join('\n')});
}

/* ══ EFFECTS (JS) ══ */
const R = document.documentElement;
let autoFx = false;
function applyFx() { const st = store.get('fx'); const on = st === 'on' || (st !== 'off' && autoFx); R.classList.toggle('fx', on); $('fxb')?.classList.toggle('on', on); }
function toggleFx() { const on = !R.classList.contains('fx'); store.set('fx', on ? 'on' : 'off'); applyFx(); toast(on ? 'Effects on' : 'Effects off'); }
/* FPS guard: effects switch on if the phone is smooth, and off if it ever lags (unless you chose manually with ✨ FX) */
(function () {
  let n = 0, t0 = 0, on = false, low = 0, dead = false, T0 = 0;
  function fr(t) {
    if (dead) return; if (!T0) T0 = t; if (t - T0 > 10000) return; if (!t0) t0 = t; n++;
    if (t - t0 >= 1000) {
      const f = n * 1000 / (t - t0); n = 0; t0 = t;
      if (!on) { if (f >= 50) { on = true; autoFx = true; applyFx(); } }
      else if (f < 42) { if (++low >= 2) { on = false; dead = true; autoFx = false; applyFx(); } } else low = 0;
    }
    requestAnimationFrame(fr);
  }
  setTimeout(() => requestAnimationFrame(fr), 1400);
})();
applyFx();
/* floating dots */
(function () { const pt = $('pt'); for (let i = 0; i < 12; i++) { const d = document.createElement('i'); d.style.left = (Math.random() * 100) + '%'; d.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px'); d.style.animationDuration = (9 + Math.random() * 9) + 's'; d.style.animationDelay = (-Math.random() * 14) + 's'; d.style.width = d.style.height = (2 + Math.random() * 2.5) + 'px'; pt.appendChild(d); } })();
/* typewriter greeting */
(function () { const el = $('name'), t = el.textContent; el.textContent = ''; el.classList.add('cur'); let i = 0; setTimeout(function k() { el.textContent = t.slice(0, ++i); if (i < t.length) setTimeout(k, 55); else setTimeout(() => el.classList.remove('cur'), 900); }, 500); })();
/* 3D tilt on press */
(function () {
  const g = $('grid'); let el = null;
  g.addEventListener('animationend', e => { if (e.animationName === 'up' && e.target.classList.contains('item') && !e.target.classList.contains('vip')) e.target.classList.add('done'); });
  g.addEventListener('pointerdown', e => { const b = e.target.closest('.item'); if (b && b.classList.contains('done')) el = b; });
  g.addEventListener('pointermove', e => { if (!el) return; const r = el.getBoundingClientRect(), dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5; el.style.transform = 'perspective(520px) rotateX(' + (-dy * 14).toFixed(1) + 'deg) rotateY(' + (dx * 14).toFixed(1) + 'deg) scale(.965)'; });
  const end = () => { if (el) { el.style.transform = ''; el = null; } };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => g.addEventListener(t, end));
})();
/* touch spotlight + ripple + haptic */
$('grid').addEventListener('pointerdown', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const r = b.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  b.style.setProperty('--mx', px + 'px'); b.style.setProperty('--my', py + 'px');
  const d = document.createElement('span'); d.className = 'rip'; d.style.left = px + 'px'; d.style.top = py + 'px'; b.appendChild(d); setTimeout(() => d.remove(), 650);
  try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {}
});
/* swipe down to close the sheet */
(function () {
  const sh = $('sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('input,textarea,select')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive: true});
  sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = 'translateY(' + dy + 'px)'; }, {passive: true});
  sh.addEventListener('touchend', () => { if (y0 === null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; });
})();
/* press animation on the main button */
$('go').addEventListener('click', () => { $('go').classList.remove('sent'); void $('go').offsetWidth; $('go').classList.add('sent'); });

/* ── access check ── */
if (!tg?.initData) banner('Open this panel from inside Telegram.');
else if (!BASE && location.protocol !== 'http:' && location.protocol !== 'https:') banner('Server address missing.');
else fetch(BASE + '/api/status', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({initData: tg.initData})})
  .then(r => r.json()).then(d => { if (d.error) banner(d.error); else if (!d.has_access) banner("You don't have access yet. Contact the owner."); })
  .catch(() => banner('Cannot reach the bot server.'));
</script>
</body></html>
